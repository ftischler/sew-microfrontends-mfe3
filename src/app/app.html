<section>
  <header>
    <h2>Microfrontend 3</h2>
    <span class="badge">Angular {{ angularVersion }}</span>
  </header>

  @switch (path()) {
    @case ('details') {
      <p>Details page, rendered for path "details".</p>
      <button type="button" (click)="navigate.emit('')">Back to overview</button>
    }
    @default {
      <p>Overview page. This remote ships its own Angular runtime as a web component.</p>
      <button type="button" (click)="navigate.emit('details')">Show details</button>
    }
  }
</section>
